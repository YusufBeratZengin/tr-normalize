name: Bug report
description: Report wrong output or a crash.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: tr-normalize version
      description: Output of `tr-normalize --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Smallest input and call that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
